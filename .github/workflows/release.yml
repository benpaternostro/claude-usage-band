name: Release

# Runs when a new version in plugin.json reaches main: tags it
# usage-band--v<version> and publishes the GitHub release. The notes are the
# merged release PR's description when the Release PR workflow opened it, and
# GitHub's generated notes otherwise. A version that is already tagged is
# skipped, so other edits to plugin.json release nothing.

on:
  push:
    branches: [main]
    paths: [.claude-plugin/plugin.json]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency: release

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      tagged: ${{ steps.version.outputs.tagged }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          version=$(jq -r .version .claude-plugin/plugin.json)
          tag="usage-band--v$version"
          tagged=false
          if git ls-remote --exit-code --tags origin "$tag" >/dev/null; then tagged=true; fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "tagged=$tagged" >>"$GITHUB_OUTPUT"
          if $tagged; then echo "::notice::$tag is already released"; fi

  test:
    needs: check
    if: needs.check.outputs.tagged == 'false'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [check, test]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DISABLE_AUTOUPDATER: 1
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code

      - name: Tag the version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          claude plugin tag . --push

      - name: Publish the release
        run: |
          body=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].body // ""')
          notes=(--generate-notes)
          if grep -q '<!-- release-notes' <<<"$body"; then
            printf '%s\n' "$body" >"$RUNNER_TEMP/notes.md"
            notes=(--notes-file "$RUNNER_TEMP/notes.md")
          fi
          gh release create "$TAG" --verify-tag --latest --title "usage-band v$VERSION" "${notes[@]}"
