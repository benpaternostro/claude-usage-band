name: Release PR

# Run by hand from the Actions tab. Bumps the version in plugin.json and opens
# a release PR whose description holds the release notes. Merging the PR runs
# the Release workflow, which tags the version and publishes the notes.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: minor

permissions:
  contents: write
  pull-requests: write

concurrency: release

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  pr:
    needs: test
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BUMP: ${{ inputs.bump }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Bump the version
        id: bump
        run: |
          old=$(jq -r .version .claude-plugin/plugin.json)
          IFS=. read -r major minor patch <<<"$old"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          new="$major.$minor.$patch"
          if git ls-remote --exit-code --tags origin "usage-band--v$new" >/dev/null; then
            echo "::error::usage-band--v$new is already tagged"
            exit 1
          fi
          sed -i "s/\"version\": \"$old\"/\"version\": \"$new\"/" .claude-plugin/plugin.json
          test "$(jq -r .version .claude-plugin/plugin.json)" = "$new"
          echo "old=$old" >>"$GITHUB_OUTPUT"
          echo "new=$new" >>"$GITHUB_OUTPUT"

      - name: Draft the release notes
        env:
          OLD: ${{ steps.bump.outputs.old }}
          NEW: ${{ steps.bump.outputs.new }}
        run: |
          args=(-f tag_name="usage-band--v$NEW" -f target_commitish="$GITHUB_REF_NAME")
          if git rev-parse -q --verify "refs/tags/usage-band--v$OLD" >/dev/null; then
            args+=(-f previous_tag_name="usage-band--v$OLD")
          fi
          changes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body)
          {
            echo '<!-- release-notes: the Release workflow publishes this description as the release notes. Edit it before you merge. -->'
            echo
            echo "$changes"
            echo
            echo '## Update'
            echo
            echo '```bash'
            echo 'claude plugin update usage-band@claude-usage-band'
            echo '```'
          } >"$RUNNER_TEMP/notes.md"

      - name: Open the release PR
        env:
          NEW: ${{ steps.bump.outputs.new }}
        run: |
          branch="release-v$NEW"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -am "Release usage-band v$NEW"
          git push -u origin "$branch"
          gh pr create --base "$GITHUB_REF_NAME" --head "$branch" \
            --title "Release usage-band v$NEW" --body-file "$RUNNER_TEMP/notes.md"
